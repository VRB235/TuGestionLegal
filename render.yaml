# Render Blueprint — Web Service + MySQL externo (Railway/Aiven/etc.)
# Docs: https://render.com/docs/blueprint-spec
#
# Nota: Render no ofrece MySQL managed en free. Opciones:
#  1) Usar Railway (recomendado: app + MySQL juntos)
#  2) En Render: este web service + DATABASE_URL de un MySQL externo

services:
  - type: web
    name: tu-gestion-legal
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrador
      - key: CRON_SECRET
        generateValue: true
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GOOGLE_PLACE_ID
        value: ChIJM_DeDM_wpw8RHUzVPD9E8Vg
      - key: GOOGLE_WRITE_REVIEW_URL
        value: https://g.page/r/CR1M1Tw_RPFYEBM/review
